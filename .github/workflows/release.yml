name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release tag is immutable release state. Do not cancel a running publish
  # halfway through an upload when a retry or duplicate event is queued.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    # Every step below assumes a strict tag ref (release name, notes file,
    # version assertion); a manual dispatch from a branch must skip instead of
    # publishing a garbage-named release.
    if: github.ref_type == 'tag'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release notes exist
        # Fail before the multi-minute build, not at publish time.
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${NOTES}" ]]; then
            echo "::error::missing or empty ${NOTES} — every tagged release ships curated notes"
            exit 1
          fi

      - name: Validate release ref
        run: ./Scripts/release-preflight.sh "${GITHUB_REF_NAME}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run local CI release gate
        # The gate verifies source/build/package health. It may use the runner's
        # local signing fallback; the distribution step below is intentionally
        # stricter and requires Developer ID plus notarization credentials.
        env:
          DEVTYPE_SKIP_AUTO_CERT: '1'
        run: ./Scripts/ci-local.sh

      - name: Build & Package DMG
        env:
          # This project cannot use Developer ID/notarization credentials. The
          # explicit opt-in publishes a development-signed, unnotarized DMG;
          # release notes and the README warn users that Gatekeeper may reject it.
          DEVTYPE_ALLOW_UNTRUSTED_RELEASE: '1'
          DEVTYPE_SKIP_AUTO_CERT: '1'
          DEVTYPE_SKIP_NOTARIZE: '1'
          DEVTYPE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./Scripts/release.sh

      - name: Locate DMG
        id: dmg
        # Fails on zero, multiple, or version-mismatched candidates — never
        # uploads an arbitrary or mislabeled artifact.
        run: Scripts/select-release-dmg.sh dist "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Pin the publishing action to the commit behind v3 so a mutable tag cannot
        # change the code that receives contents:write during a retry.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dmg.outputs.dmg_path }}
          body_path: docs/releases/${{ github.ref_name }}.md
          name: DevType ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The repository maintains curated per-tag notes. Generated notes are
          # disabled so retries cannot duplicate the body or append unrelated
          # commit activity to the release description.
          generate_release_notes: false
          append_body: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_DMG: ${{ steps.dmg.outputs.dmg_name }}
          LOCAL_DMG: ${{ steps.dmg.outputs.dmg_path }}
        run: |
          set -euo pipefail

          [[ "$(gh release view "${RELEASE_TAG}" --json tagName --jq .tagName)" == "${RELEASE_TAG}" ]] \
            || { echo "::error::published release tag does not match ${RELEASE_TAG}"; exit 1; }
          [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" == "false" ]] \
            || { echo "::error::published release is still a draft"; exit 1; }
          [[ "$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)" == "false" ]] \
            || { echo "::error::published release is unexpectedly a prerelease"; exit 1; }

          EXPECTED_BODY="$(cat "docs/releases/${RELEASE_TAG}.md")"
          PUBLISHED_BODY="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
          [[ "${PUBLISHED_BODY}" == "${EXPECTED_BODY}" ]] \
            || { echo "::error::published release body differs from curated notes"; exit 1; }

          VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP}/devtype-release-verify.XXXXXX")"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' \
            > "${VERIFY_DIR}/asset-names.txt"
          Scripts/verify-release-asset-list.sh "${EXPECTED_DMG}" \
            < "${VERIFY_DIR}/asset-names.txt"

          DOWNLOADED=0
          for attempt in 1 2 3 4 5; do
            if gh release download "${RELEASE_TAG}" \
              --pattern "${EXPECTED_DMG}" --dir "${VERIFY_DIR}" --clobber; then
              DOWNLOADED=1
              break
            fi
            [[ "${attempt}" -lt 5 ]] || break
            sleep "$((attempt * 2))"
          done
          [[ "${DOWNLOADED}" -eq 1 ]] \
            || { echo "::error::could not download ${EXPECTED_DMG} after bounded retries"; exit 1; }

          DOWNLOADED_DMG="${VERIFY_DIR}/${EXPECTED_DMG}"
          Scripts/select-release-dmg.sh "${VERIFY_DIR}" "${RELEASE_TAG#v}" >/dev/null
          cmp -s "${LOCAL_DMG}" "${DOWNLOADED_DMG}" \
            || { echo "::error::published DMG differs from the locally built artifact"; exit 1; }
          echo "verified GitHub release ${RELEASE_TAG}: notes and ${EXPECTED_DMG} match"
