name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release tag is immutable release state. Do not cancel a running publish
  # halfway through an upload when a retry or duplicate event is queued.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build & Publish Release
    needs: [ci]
    # Every step below assumes a strict tag ref (release name, notes file,
    # version assertion); a manual dispatch from a branch must skip instead of
    # publishing a garbage-named release.
    if: github.ref_type == 'tag'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release notes exist
        # Fail before the multi-minute build, not at publish time.
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${NOTES}" ]]; then
            echo "::error::missing or empty ${NOTES} — every tagged release ships curated notes"
            exit 1
          fi

      - name: Validate release ref
        run: ./Scripts/release-preflight.sh "${GITHUB_REF_NAME}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Run publication fixtures
        # The reusable CI job already built and tested on macOS 14 and 26.
        # Re-running `ci-local.sh` here re-executed the engine suite and failed
        # a v0.1.6 publish after that suite had already passed. Fixtures are
        # the remaining publication-specific gate.
        run: ./Scripts/ci-release-fixtures.sh

      - name: Build & Package DMG
        env:
          # This project cannot use Developer ID/notarization credentials. The
          # explicit opt-in publishes a development-signed, unnotarized DMG;
          # release notes and the README warn users that Gatekeeper may reject it.
          DEVTYPE_ALLOW_UNTRUSTED_RELEASE: '1'
          DEVTYPE_SKIP_AUTO_CERT: '1'
          DEVTYPE_SKIP_NOTARIZE: '1'
          DEVTYPE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./Scripts/release.sh

      - name: Verify draft and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./Scripts/publish-release.sh "${GITHUB_REF_NAME}" dist
