name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    # Every step below assumes a strict tag ref (release name, notes file,
    # version assertion); a manual dispatch from a branch must skip instead of
    # publishing a garbage-named release.
    if: github.ref_type == 'tag'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release notes exist
        # Fail before the multi-minute build, not at publish time.
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${NOTES}" ]]; then
            echo "::error::missing or empty ${NOTES} — every tagged release ships curated notes"
            exit 1
          fi

      - name: Validate release ref
        run: ./Scripts/release-preflight.sh "${GITHUB_REF_NAME}"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Build & Package DMG
        env:
          DEVTYPE_SKIP_NOTARIZE: '1'
          DEVTYPE_SKIP_AUTO_CERT: '1'
          DEVTYPE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./Scripts/release.sh

      - name: Locate DMG
        id: dmg
        # Fails on zero, multiple, or version-mismatched candidates — never
        # uploads an arbitrary or mislabeled artifact.
        run: Scripts/select-release-dmg.sh dist "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dmg.outputs.dmg_path }}
          body_path: docs/releases/${{ github.ref_name }}.md
          name: DevType ${{ github.ref_name }}
          draft: false
          prerelease: false
          # The repository maintains curated per-tag notes. Generated notes are
          # disabled so retries cannot duplicate the body or append unrelated
          # commit activity to the release description.
          generate_release_notes: false
          append_body: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
