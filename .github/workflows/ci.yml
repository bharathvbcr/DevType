# §0.2 — CI gate.
#
# DevType intercepts and swallows keystrokes system-wide via a CGEventTap, and
# rewrites text in other applications by erasing characters before injecting.
# A regression in AbbreviationMatcher or ErasePlan silently destroys user text.
# That is the class of bug this workflow exists to catch.
name: CI

on:
  push:
    branches: [main]
    # Release tags are owned by .github/workflows/release.yml, which calls this
    # workflow. A second `v*` push here raced the reusable suite for macos-26
    # runners and did not add a distinct gate.
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # Called workflows inherit the caller's workflow name. Keep this distinct
  # from Release's group so CI cannot cancel or deadlock its own caller.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One definition for both images. macos-14 keeps canImport(FoundationModels)
  # false (stub + .macOS(.v14) guard); macos-26 makes it true so
  # AITextTransformer is actually built and tested. fail-fast is off so a
  # failure on one image still reports the other.
  test:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            name: macOS 14
          - runner: macos-26
            name: macOS 26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # package-app.sh derives the version from `git describe`; a shallow
          # clone has no tags and would stamp every build 0.0.0.
          fetch-depth: 0

      - name: Toolchain and build cache
        uses: ./.github/actions/swift-build-cache
        with:
          runner: ${{ matrix.runner }}

      - name: Build (debug)
        run: swift build

      - name: Test
        # ExpanderEngineTests is headless: no window server, no TCC grants.
        # Tests that need a real event tap or AX access must stay out of this
        # target. Debug timings are not the gate; strip DEVTYPE_BENCH so a
        # caller cannot fail the suite on a wall-clock ceiling.
        run: env -u DEVTYPE_BENCH ./Scripts/test.sh

      - name: Build (release)
        run: swift build -c release

  package:
    name: Package .app
    runs-on: macos-26
    timeout-minutes: 30
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Toolchain and build cache
        uses: ./.github/actions/swift-build-cache
        with:
          runner: macos-26

      - name: Package (ad-hoc signed)
        # CI has no login keychain cert, so this exercises the ad-hoc fallback
        # path in package-app.sh. It proves the bundle assembles, the plist
        # survives, and the version stamping works — not that it is distributable.
        env:
          DEVTYPE_SKIP_AUTO_CERT: '1'
        run: ./Scripts/package-app.sh release

      - name: Verify bundle identity
        # This job is pinned to macos-26 precisely so the packaged bundle has
        # the Foundation Models features. Asserting it here catches a runner
        # or SDK regression on the pull request that causes it, not at tag time.
        env:
          DEVTYPE_REQUIRE_FOUNDATION_MODELS: '1'
        run: ./Scripts/verify-packaged-bundle.sh .build/DevType.app

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DevType-app-unsigned
          path: .build/DevType.app
          retention-days: 14

  lint:
    name: Repo hygiene
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hygiene
        run: ./Scripts/ci-hygiene.sh
